<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倒數計時器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="particle-layer" id="particle-layer" aria-hidden="true"></div>

  <main class="timer-app">
    <section class="timer-panel" aria-labelledby="app-title">
      <div class="title-group">
        <p class="eyebrow">Countdown Timer</p>
        <h1 id="app-title">倒數計時器</h1>
      </div>

      <form class="time-form" id="time-form">
        <label>
          <span>分鐘</span>
          <input id="minutes" type="number" min="0" max="999" value="5" inputmode="numeric">
        </label>
        <label>
          <span>秒數</span>
          <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric">
        </label>
      </form>

      <div class="display" id="display" role="timer" aria-live="polite">05:00</div>

      <div class="controls">
        <button id="start-btn" type="button">開始</button>
        <button id="pause-btn" type="button" class="secondary">暫停</button>
        <button id="reset-btn" type="button" class="secondary">重設</button>
      </div>

      <p class="status" id="status">設定時間後按開始</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
