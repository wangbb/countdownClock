<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#20498;&#25976;&#35336;&#26178;&#22120;</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="particle-layer" id="particle-layer" aria-hidden="true"></div>

  <main class="timer-app">
    <section class="timer-panel" aria-labelledby="app-title">
      <div class="title-group">
        <p class="eyebrow">Countdown Timer</p>
        <h1 id="app-title">&#20498;&#25976;&#35336;&#26178;&#22120;</h1>
      </div>

      <form class="time-form" id="time-form">
        <label>
          <span>&#20998;&#37912;</span>
          <input id="minutes" type="number" min="0" max="999" value="5" inputmode="numeric">
        </label>
        <label>
          <span>&#31186;&#25976;</span>
          <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric">
        </label>
      </form>

      <div class="display" id="display" role="timer" aria-live="polite">05:00</div>

      <div class="controls">
        <button id="start-btn" type="button">&#38283;&#22987;</button>
        <button id="pause-btn" type="button" class="secondary">&#26283;&#20572;</button>
        <button id="reset-btn" type="button" class="secondary">&#37325;&#35373;</button>
      </div>

      <p class="status" id="status">&#35373;&#23450;&#26178;&#38291;&#24460;&#25353;&#38283;&#22987;</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
